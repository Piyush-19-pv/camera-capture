<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capture Your Photo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: #070b16;
            overflow-x: hidden;
        }

        /* Background */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .35;
            animation: float 7s ease-in-out infinite;
        }

        .orb-one {
            background: #6366f1;
            top: -120px;
            left: -100px;
        }

        .orb-two {
            background: #a855f7;
            right: -120px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -25px);
            }
        }

        /* Main */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 470px;

            padding: 38px 28px;

            text-align: center;

            background: rgba(255,255,255,.07);

            border: 1px solid rgba(255,255,255,.13);

            border-radius: 30px;

            backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.5);

            animation: cardIn .8s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Camera icon */

        .camera-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 27px;

            font-size: 42px;

            background: linear-gradient(
                135deg,
                rgba(99,102,241,.25),
                rgba(168,85,247,.25)
            );

            border: 1px solid rgba(255,255,255,.12);

            box-shadow:
                0 15px 40px rgba(99,102,241,.18);

            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 36px;
            line-height: 1.15;
            margin-bottom: 14px;
            letter-spacing: -.8px;
        }

        .gradient-text {
            background: linear-gradient(
                90deg,
                #818cf8,
                #c084fc,
                #f0abfc
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .description {
            color: #aab4c8;
            font-size: 15px;
            line-height: 1.7;
            max-width: 360px;
            margin: 0 auto 28px;
        }

        /* Button */

        .start-btn {
            width: 100%;
            min-height: 58px;

            border: 0;
            border-radius: 17px;

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            box-shadow:
                0 12px 30px rgba(99,102,241,.28);

            transition: .25s ease;

            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 18px 40px rgba(99,102,241,.4);
        }

        .start-btn:active {
            transform: scale(.98);
        }

        /* Info */

        .info {
            margin-top: 22px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            color: #8f9bb0;

            font-size: 12px;
        }

        .lock {
            font-size: 15px;
        }

        /* Steps */

        .steps {
            margin-top: 30px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 8px;
        }

        .step {
            padding: 13px 7px;

            border-radius: 15px;

            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.06);
        }

        .step-icon {
            font-size: 19px;
            margin-bottom: 6px;
        }

        .step-text {
            color: #9ca8bc;
            font-size: 11px;
        }

        /* Mobile */

        @media (max-width: 480px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 32px 20px;
                border-radius: 25px;
            }

            .camera-icon {
                width: 76px;
                height: 76px;
                font-size: 35px;
                border-radius: 23px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 14px;
            }

            .start-btn {
                min-height: 55px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
</div>


<main class="page">

    <section class="card">

        <div class="camera-icon">
            📸
        </div>

        <h1>
            Capture Your
            <span class="gradient-text">
                Moment
            </span>
        </h1>

        <p class="description">
            Take a quick photo using your device camera.
            Allow camera access to continue and capture
            your photo in just a few seconds.
        </p>


        <a
            href="{% url 'capture' %}"
            class="start-btn">

            <span>📷</span>

            <span>
                Start Camera
            </span>

        </a>


        <div class="info">

            <span class="lock">
                🔒
            </span>

            <span>
                Camera access requires your permission
            </span>

        </div>


        <div class="steps">

            <div class="step">

                <div class="step-icon">
                    📷
                </div>

                <div class="step-text">
                    Allow Camera
                </div>

            </div>


            <div class="step">

                <div class="step-icon">
                    ⏱️
                </div>

                <div class="step-text">
                    3 Second Timer
                </div>

            </div>


            <div class="step">

                <div class="step-icon">
                    💾
                </div>

                <div class="step-text">
                    Save Photo
                </div>

            </div>

        </div>

    </section>

</main>

</body>
</html>
